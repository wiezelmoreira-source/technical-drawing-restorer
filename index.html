<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technical Drawing Restorer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <header>
        <h1>Technical Drawing Restorer</h1>
        <div class="controls">
            <!-- Label que funciona diretamente como o botão de upload -->
            <label for="input-arquivo" class="btn-primary" style="cursor: pointer;">
                📁 Abrir Desenho (PNG/JPG)
            </label>
            <input type="file" id="input-arquivo" accept="image/png, image/jpeg" style="display: none;">
        </div>
        <p>Engineering Mode: <strong style="color: #00ffcc;">ATIVADO</strong></p>
    </header>

    <main>
        <div class="canvas-container">
            <canvas id="canvas-restaurador"></canvas>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
