<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technical Drawing Restorer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <header>
        <h1>Technical Drawing Restorer</h1>
        <div class="controls">
            <!-- Botão padrão e visível para garantir o disparo -->
            <input type="file" id="input-arquivo" accept="image/png, image/jpeg">
        </div>
        <p>Engineering Mode: <strong style="color: #00ffcc;">ATIVADO</strong></p>
    </header>

    <main>
        <div class="canvas-container">
            <canvas id="canvas-restaurador"></canvas>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
