<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technical Drawing Restorer</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Biblioteca PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
</head>
<body>
    <header>
        <h1>Technical Drawing Restorer</h1>
        <div class="controls">
            <!-- Filtro expandido para garantir visualização de todos os formatos -->
            <input type="file" id="input-arquivo" accept=".png, .jpg, .jpeg, .pdf, image/*, application/pdf">
        </div>
        <p>Engineering Mode: <strong style="color: #00ffcc;">ATIVADO</strong></p>
    </header>

    <main>
        <div class="canvas-container">
            <canvas id="canvas-restaurador"></canvas>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
